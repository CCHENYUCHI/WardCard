version: '3.8'

services:
  wordcard-server:
    build:
      context: .
      args:
        # Version shown in Settings → 版本資訊 (the image has no .git)
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BRANCH: ${APP_BRANCH:-unknown}
    container_name: wordcard-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Taipei}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
